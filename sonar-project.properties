# Tests live inside the package (neutron/tests). Main and test sources share the
# neutron/ root and are split with inclusion/exclusion patterns so they stay disjoint.
sonar.sources=neutron
sonar.tests=neutron
sonar.exclusions=neutron/tests/**,neutron/locale/**
sonar.test.inclusions=neutron/tests/**

# Python coverage, produced in CI by:
#     coverage combine && coverage xml -o coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11, 3.12, 3.13
